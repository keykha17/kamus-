<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kamus Coding XOS</title>

  <style>
    /* VARIASI WARNA MENGIKUTI SISTEM HP (LIGHT & DARK MODE) */
    :root {
      --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      --font-code: ui-monospace, SFMono-Regular, Consolas, monospace;

      /* DEFAULT: DARK MODE (PADA SISTEM GELAP) */
      --bg-main: #000000;
      --bg-card: #1c1c1c;
      --bg-input: #121212;
      --text-main: #ffffff;
      --text-sub: #8a8a8a;
      --border-line: #2c2c2c;
      --accent-orange: #ffffff;
      --code-bg: #111111;
      --code-text: #d4d4d4;
      --success-green: #ffffff;
      --danger-red: #8a8a8a;

      --status-bar-height: env(safe-area-inset-top, 0px);
      --nav-bar-height: env(safe-area-inset-bottom, 0px);
    }

    /* OTOMATIS BERALIH SAAT HP PADA LIGHT MODE */
    @media (prefers-color-scheme: light) {
      :root {
        --bg-main: #f2f2f2;
        --bg-card: #ffffff;
        --bg-input: #e5e5e5;
        --text-main: #000000;
        --text-sub: #6b6b6b;
        --border-line: #e5e5e5;
        --code-bg: #2c2c2c;
        --code-text: #e5e5e5;
        --accent-orange: #000000;
        --success-green: #000000;
        --danger-red: #6b6b6b;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: var(--font-system);
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      padding-top: var(--status-bar-height);
      padding-bottom: var(--nav-bar-height);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .sys-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* TOP BAR HEADER */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1rem;
      background: var(--bg-main);
      border-bottom: 1px solid var(--border-line);
      z-index: 10;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
    }

    /* TAB SWITCHER */
    .tab-switcher {
      display: flex;
      background: var(--bg-card);
      border-radius: 20px;
      padding: 3px;
      border: 1px solid var(--border-line);
    }

    .tab-item {
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-item.active {
      background: var(--bg-main);
      color: var(--text-main);
    }

    /* MAIN CONTENT AREA */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1rem 4rem 1rem;
    }

    .main-content {
      overscroll-behavior-y: contain;
      position: relative;
      background: var(--bg-main);
      z-index: 2;
    }

    /* TARIK UNTUK REFRESH */
    .ptr {
      position: absolute;
      left: 0;
      right: 0;
      top: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    .ptr-ring {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border-line);
      border-top-color: var(--text-main);
      border-radius: 50%;
    }

    .ptr.loading .ptr-ring {
      animation: ptr-spin 0.7s linear infinite;
    }

    @keyframes ptr-spin {
      to { transform: rotate(360deg); }
    }

    .category-header {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    /* PENCARIAN (SEARCH FIRST) */
    .search-view-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-big-box {
      width: 100%;
      height: 48px;
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 1.2rem;
      gap: 10px;
    }

    .search-big-box input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: var(--font-system);
      outline: none;
    }

    .search-big-box input::placeholder {
      color: var(--text-sub);
    }

    .search-placeholder-msg {
      text-align: center;
      color: var(--text-sub);
      font-size: 0.85rem;
      margin-top: 3rem;
      line-height: 1.5;
    }

    /* TAMPILAN DAFTAR (LIST VIEW 1 KOLOM) */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .note-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1rem;
      border: 1px solid var(--border-line);
      cursor: pointer;
    }

    .note-card:active {
      opacity: 0.8;
    }

    .note-title {
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .note-desc {
      font-size: 0.82rem;
      color: var(--text-sub);
      line-height: 1.4;
    }

    .badge-tag {
      font-size: 0.62rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--bg-main);
      color: var(--text-sub);
      border: 1px solid var(--border-line);
    }

    .note-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .note-card.open .note-detail {
      max-height: 1200px;
      padding-top: 8px;
      border-top: 1px solid var(--border-line);
      margin-top: 8px;
    }

    pre code {
      font-family: var(--font-code);
      background: var(--code-bg);
      color: var(--code-text);
      display: block;
      padding: 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border-line);
      overflow-x: auto;
      margin-top: 6px;
      font-size: 0.78rem;
      white-space: pre-wrap;
      user-select: text;
    }

    /* GAME KUIS VIEW */
    .quiz-container {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 1.2rem;
      border: 1px solid var(--border-line);
    }

    .quiz-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .quiz-question {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 1rem;
    }

    .quiz-opt-btn {
      width: 100%;
      padding: 0.9rem;
      border-radius: 12px;
      border: 1px solid var(--border-line);
      background: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-system);
      font-size: 0.88rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    /* Benar = tebal, bingkai tegas + centang. Salah = abu-abu, putus-putus, dicoret */
    .quiz-opt-btn.correct {
      background: rgba(128, 128, 128, 0.25);
      border: 2px solid var(--success-green);
      color: var(--success-green);
      font-weight: 800;
    }

    .quiz-opt-btn.correct::after {
      content: " ✓";
    }

    .quiz-opt-btn.wrong {
      background: rgba(128, 128, 128, 0.08);
      border: 2px dashed var(--danger-red);
      color: var(--danger-red);
      text-decoration: line-through;
    }

    .quiz-explanation {
      background: var(--bg-main);
      border-radius: 12px;
      padding: 0.9rem;
      border: 1px solid var(--border-line);
      font-size: 0.82rem;
      line-height: 1.4;
      color: var(--text-sub);
      display: none;
      margin-bottom: 1rem;
    }

    .quiz-next-btn {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      background: var(--text-main);
      color: var(--bg-main);
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: none;
    }

    /* SIDEBAR DRAWER XOS */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
    }

    .drawer-overlay.active {
      display: block;
    }

    .drawer-content {
      width: 75vw;
      max-width: 300px;
      height: 100%;
      background: var(--bg-card);
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    .drawer-overlay.active .drawer-content {
      transform: translateX(0);
    }

    .drawer-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
    }

    /* BOTTOM SHEET EDIT JSON */
    .sheet-modal {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border-radius: 0;
      padding: calc(1rem + var(--status-bar-height)) 0 calc(1rem + var(--nav-bar-height)) 0;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }

    .sheet-modal.active {
      transform: translateY(0);
    }

    .json-textarea {
      width: 100%;
      flex: 1;
      min-height: 0;
      background: var(--bg-main);
      border: none;
      border-top: 1px solid var(--border-line);
      border-bottom: 1px solid var(--border-line);
      border-radius: 0;
      padding: 0.8rem 1rem;
      color: var(--text-main);
      font-family: var(--font-code);
      font-size: 0.8rem;
      outline: none;
      resize: none;
      margin: 0.8rem 0;
      user-select: text;
    }

    .sheet-modal h3 {
      padding: 0 1rem;
    }

    .btn-row {
      padding: 0 1rem;
      display: flex;
      gap: 8px;
    }

    .btn-sheet {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border-line);
      background: var(--bg-main);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }

    /* TOAST */
    .toast-msg {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--bg-card);
      color: var(--text-main);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      border: 1px solid var(--border-line);
      font-size: 0.8rem;
      font-weight: 600;
      z-index: 300;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- SVG ICONS -->
  <svg style="display: none;">
    <defs>
      <g id="ic-menu"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></g>
      <g id="ic-search"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></g>
      <g id="ic-settings"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/></g>
    </defs>
  </svg>

  <div id="app">
    <!-- TOP BAR -->
    <div class="top-bar">
      <button class="icon-btn" onclick="toggleDrawer(true)">
        <svg class="sys-icon"><use href="#ic-menu"/></svg>
      </button>

      <div class="tab-switcher">
        <div class="tab-item" onclick="switchTab('learn', this)">Belajar</div>
        <div class="tab-item active" onclick="switchTab('search', this)">Cari</div>
        <div class="tab-item" onclick="switchTab('quiz', this)">Kuis</div>
      </div>

      <div style="width: 40px;"></div>
    </div>

    <!-- INDIKATOR TARIK UNTUK REFRESH -->
    <div class="ptr" id="ptr">
      <span class="ptr-ring"></span>
      <span id="ptr-text">Tarik untuk memuat ulang</span>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <div class="category-header" id="category-title">Pencarian Istilah</div>

      <!-- 1. HALAMAN PENCARIAN (MUNCUL JIKA DICARI) -->
      <div id="search-view" class="search-view-container">
        <div class="search-big-box">
          <svg class="sys-icon" style="color: var(--text-sub);"><use href="#ic-search"/></svg>
          <input type="search" id="main-search-input" placeholder="Ketik kata kunci pencarian..." oninput="onSearchInput(this.value)">
        </div>

        <div id="search-placeholder-text" class="search-placeholder-msg">
           Ketikkan istilah atau bahasa pemrograman<br>pada kotak di atas untuk menampilkan hasil.
        </div>

        <div class="card-list" id="search-results-list" style="display: none;"></div>
      </div>

      <!-- 2. HALAMAN BELAJAR (DAFTAR VERTIKAL 1 KOLOM) -->
      <div id="learn-view" style="display: none;">
        <div class="card-list" id="learn-list"></div>
      </div>

      <!-- 3. HALAMAN KUIS (GAME TANYA JAWAB) -->
      <div id="quiz-view" style="display: none;">
        <div class="quiz-container">
          <div class="quiz-stats">
            <span id="quiz-progress">Soal 1 dari 5</span>
            <span id="quiz-score">Skor: 0</span>
          </div>
          <div class="quiz-question" id="quiz-question-text">Memuat pertanyaan...</div>
          <div class="quiz-options" id="quiz-options-list"></div>
          <div class="quiz-explanation" id="quiz-explanation-box"></div>
          <button class="quiz-next-btn" id="quiz-next-btn" onclick="nextQuestion()">Soal Berikutnya</button>
        </div>
      </div>

    </div>
  </div>

  <!-- SIDEBAR DRAWER -->
  <div class="drawer-overlay" id="drawer" onclick="toggleDrawer(false)">
    <div class="drawer-content" onclick="event.stopPropagation()">
      <div>
        <h3 style="font-size:1.1rem; margin-bottom: 1.5rem;">Kategori</h3>
        <div class="drawer-menu-item" onclick="filterDrawer('all')">
          <span>Semua Data</span>
          <span id="count-all">0</span>
        </div>
        <div class="drawer-menu-item" onclick="filterDrawer('terms')">
          <span>Kamus Istilah</span>
          <span id="count-terms">0</span>
        </div>
        <div class="drawer-menu-item" onclick="filterDrawer('langs')">
          <span>Bahasa Pemrograman</span>
          <span id="count-langs">0</span>
        </div>
      </div>

      <div>
        <div class="drawer-menu-item" onclick="openSheetModal()">
          <span style="display:flex; align-items:center; gap:8px;">
            <svg class="sys-icon"><use href="#ic-settings"/></svg> Kelola JSON
          </span>
        </div>
        <div class="drawer-menu-item" onclick="resetData()" style="color: var(--text-sub);">
          <span>Reset Bawaan</span>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM SHEET EDIT JSON -->
  <div class="sheet-modal" id="sheet-modal">
    <h3 style="font-size:1rem; font-weight:700;">Kelola Database JSON</h3>
    <textarea id="json-input-text" class="json-textarea" placeholder='{"terms": [...], "languages": [...]}'></textarea>
    <div class="btn-row">
      <button class="btn-sheet" onclick="copyJSONToClipboard()">Salin</button>
      <button class="btn-sheet" onclick="pasteFromClipboard()">Tempel</button>
      <button class="btn-sheet" style="background: var(--text-main); color: var(--bg-main);" onclick="processJSONInput()">Terapkan</button>
    </div>
    <button class="btn-sheet" style="flex: none; width: calc(100% - 2rem); margin: 8px 1rem 0; border:none;" onclick="closeSheetModal()">Batal</button>
  </div>

  <div id="toast" class="toast-msg"></div>

  <script>
    const DEFAULT_DB = {
      terms: [
        {
          "name": "Variabel",
          "category": "Istilah",
          "simpleDefinition": "Wadah berlabel tempat menyimpan data di memori.",
          "analogy": "Seperti kotak yang diberi nama tempat menyimpan barang.",
          "codeExample": "let nama = \"Budi\";"
        },
        {
          "name": "Fungsi",
          "category": "Istilah",
          "simpleDefinition": "Kumpulan instruksi yang bisa dipanggil berulang kali.",
          "analogy": "Seperti saklar otomatis yang melakukan tugas tertentu.",
          "codeExample": "function sapa() { return \"Halo\"; }"
        },
        {
          "name": "Array",
          "category": "Istilah",
          "simpleDefinition": "Struktur data untuk menyimpan kumpulan beberapa nilai berurutan.",
          "analogy": "Seperti rak sepatu dengan nomor urut indeks mulai 0.",
          "codeExample": "let buah = [\"Apel\", \"Pisang\"];"
        }
      ],
      languages: [
        {
          "name": "JavaScript",
          "category": "Bahasa",
          "simpleDefinition": "Bahasa web interaktif & aplikasi mobile.",
          "codeExample": "console.log(\"Halo Dunia\");"
        },
        {
          "name": "Java",
          "category": "Bahasa",
          "simpleDefinition": "Bahasa native Android & backend enterprise.",
          "codeExample": "System.out.println(\"Halo\");"
        }
      ]
    };

    let DB = JSON.parse(JSON.stringify(DEFAULT_DB));

    let quizQuestions = [];
    let currentQuizIdx = 0;
    let quizScore = 0;
    let quizAnswered = false;

    const customData = localStorage.getItem('custom_json_data');
    if (customData) {
      try { DB = JSON.parse(customData); } catch (e) {}
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2500);
    }

    function handleAndroidBack() {
      const modal = document.getElementById('sheet-modal');
      if (modal.classList.contains('active')) {
        closeSheetModal();
        return true;
      }
      const drawer = document.getElementById('drawer');
      if (drawer.classList.contains('active')) {
        toggleDrawer(false);
        return true;
      }
      const openCard = document.querySelector('.note-card.open');
      if (openCard) {
        openCard.classList.remove('open');
        return true;
      }
      return false;
    }

    function toggleDrawer(open) {
      document.getElementById('drawer').classList.toggle('active', open);
    }

    function openSheetModal() {
      toggleDrawer(false);
      document.getElementById('json-input-text').value = JSON.stringify(DB, null, 2);
      document.getElementById('sheet-modal').classList.add('active');
    }

    function closeSheetModal() {
      document.getElementById('sheet-modal').classList.remove('active');
    }

    function switchTab(type, el) {
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      el.classList.add('active');

      const searchView = document.getElementById('search-view');
      const learnView = document.getElementById('learn-view');
      const quizView = document.getElementById('quiz-view');
      const categoryTitle = document.getElementById('category-title');

      searchView.style.display = 'none';
      learnView.style.display = 'none';
      quizView.style.display = 'none';

      if (type === 'search') {
        searchView.style.display = 'flex';
        categoryTitle.textContent = "Pencarian Istilah";
        document.getElementById('main-search-input').focus();
      } else if (type === 'learn') {
        learnView.style.display = 'block';
        categoryTitle.textContent = "Daftar Materi Belajar";
        renderLearnView();
      } else if (type === 'quiz') {
        quizView.style.display = 'block';
        categoryTitle.textContent = "Uji Pemahaman";
        startQuiz();
      }
    }

    function toggleCard(element) {
      element.parentElement.classList.toggle('open');
    }

    /* HELPER: escape HTML agar simbol seperti < > & " tampil apa adanya */
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* HELPER: gabungkan seluruh isi item (string, array, objek) menjadi satu teks pencarian */
    function collectText(v) {
      if (v == null) return '';
      if (Array.isArray(v)) return v.map(collectText).join(' ');
      if (typeof v === 'object') return Object.values(v).map(collectText).join(' ');
      return String(v);
    }

    function buildSearchText(item) {
      return Object.entries(item)
        .filter(([key]) => key !== 'type' && key !== 'id')
        .map(([, val]) => collectText(val))
        .join('\n')
        .toLowerCase();
    }

    /* 1. LOGIKA SEARCH VIEW */
    function onSearchInput(val) {
      const query = (val || '').toLowerCase().trim();
      const resultsList = document.getElementById('search-results-list');
      const placeholderMsg = document.getElementById('search-placeholder-text');

      if (!query) {
        resultsList.style.display = 'none';
        placeholderMsg.style.display = 'block';
        resultsList.innerHTML = '';
        return;
      }

      placeholderMsg.style.display = 'none';
      resultsList.style.display = 'flex';

      const allItems = [
        ...(DB.terms || []).map(t => ({...t, type: 'Istilah'})),
        ...(DB.languages || []).map(l => ({...l, type: 'Bahasa'}))
      ];

      // Cari di SEMUA field (judul, simbol, definisi, alias, contoh kode, dll.)
      // memakai includes() biasa, jadi karakter tunggal seperti "?" tetap cocok.
      const filtered = allItems.filter(item => buildSearchText(item).includes(query));

      if (filtered.length === 0) {
        resultsList.innerHTML = `<div class="note-card"><div class="note-title">Tidak Ditemukan</div></div>`;
        return;
      }

      // Urutkan: karakter yang persis sama dengan simbol tampil paling atas
      const rank = (item) => {
        if (item.symbol && String(item.symbol).toLowerCase() === query) return 0;
        if (Array.isArray(item.aliases) && item.aliases.some(a => String(a).toLowerCase() === query)) return 1;
        if (item.name && item.name.toLowerCase().includes(query)) return 2;
        return 3;
      };
      filtered.sort((a, b) => rank(a) - rank(b));

      resultsList.innerHTML = renderCardHTML(filtered);

      // Jika ada yang persis cocok dengan simbolnya, langsung buka detailnya
      if (rank(filtered[0]) === 0) {
        const first = resultsList.querySelector('.note-card');
        if (first) first.classList.add('open');
      }
    }

    /* 2. LOGIKA LEARN VIEW */
    function renderLearnView() {
      const list = document.getElementById('learn-list');
      const allItems = [
        ...(DB.terms || []).map(t => ({...t, type: 'Istilah'})),
        ...(DB.languages || []).map(l => ({...l, type: 'Bahasa'}))
      ];

      list.innerHTML = renderCardHTML(allItems);
    }

    function renderCardHTML(items) {
      return items.map((item) => {
        const code = item.codeExample || item.basicSyntax;
        const aliases = Array.isArray(item.aliases) ? item.aliases.join(', ') : '';
        return `
        <div class="note-card">
          <div onclick="toggleCard(this)">
            <div class="note-title">
              <span>${item.symbol ? `<code style="font-family:var(--font-code); color:var(--accent-orange); font-size:1.3rem; font-weight:800; margin-right:8px;">${esc(item.symbol)}</code>` : ''}${esc(item.name)}</span>
              <span class="badge-tag">${esc(item.category || item.type)}</span>
            </div>
            <div class="note-desc">${esc(item.simpleDefinition || item.purpose || '-')}</div>
          </div>
          <div class="note-detail">
            ${item.formalDefinition ? `<p style="margin-bottom:6px;"><strong>Definisi baku:</strong> ${esc(item.formalDefinition)}</p>` : ''}
            ${item.analogy ? `<p style="margin-bottom:6px;"><strong>Analogi:</strong> ${esc(item.analogy)}</p>` : ''}
            ${aliases ? `<p style="margin-bottom:6px;"><strong>Sebutan lain:</strong> ${esc(aliases)}</p>` : ''}
            ${code ? `<pre><code>${esc(code)}</code></pre>` : ''}
            ${item.exampleExplanation ? `<p style="margin-top:6px;"><strong>Penjelasan:</strong> ${esc(item.exampleExplanation)}</p>` : ''}
          </div>
        </div>
      `;
      }).join('');
    }

    /* 3. LOGIKA KUIS */
    function startQuiz() {
      const allItems = [...(DB.terms || []), ...(DB.languages || [])];
      if (allItems.length < 2) {
        document.getElementById('quiz-question-text').textContent = "Data tidak cukup untuk kuis. Tambahkan JSON di Pengaturan!";
        document.getElementById('quiz-options-list').innerHTML = '';
        return;
      }

      quizQuestions = [];
      quizScore = 0;
      currentQuizIdx = 0;

      const shuffled = [...allItems].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, 5);

      quizQuestions = selected.map(target => {
        const otherOptions = allItems.filter(i => i.name !== target.name).sort(() => 0.5 - Math.random()).slice(0, 2);
        const options = [target, ...otherOptions].sort(() => 0.5 - Math.random());
        return {
          target: target,
          options: options
        };
      });

      renderQuestion();
    }

    function renderQuestion() {
      quizAnswered = false;
      const q = quizQuestions[currentQuizIdx];
      
      document.getElementById('quiz-progress').textContent = `Soal ${currentQuizIdx + 1} dari ${quizQuestions.length}`;
      document.getElementById('quiz-score').textContent = `Skor: ${quizScore}`;
      document.getElementById('quiz-explanation-box').style.display = 'none';
      document.getElementById('quiz-next-btn').style.display = 'none';
      document.getElementById('quiz-next-btn').textContent = 'Soal Berikutnya';
      document.getElementById('quiz-next-btn').onclick = nextQuestion;

      document.getElementById('quiz-question-text').textContent = `Manakah yang dimaksud dengan: "${q.target.simpleDefinition || q.target.purpose}"?`;

      const optionsBox = document.getElementById('quiz-options-list');
      optionsBox.innerHTML = q.options.map((opt, idx) => `
        <button class="quiz-opt-btn" onclick="checkAnswer(${idx}, '${opt.name === q.target.name}')">${esc(opt.name)}</button>
      `).join('');
    }

    function checkAnswer(btnIdx, isCorrect) {
      if (quizAnswered) return;
      quizAnswered = true;

      const buttons = document.querySelectorAll('.quiz-opt-btn');
      const q = quizQuestions[currentQuizIdx];

      if (isCorrect === 'true') {
        buttons[btnIdx].classList.add('correct');
        quizScore += 20;
        document.getElementById('quiz-score').textContent = `Skor: ${quizScore}`;
      } else {
        buttons[btnIdx].classList.add('wrong');
        buttons.forEach((btn, idx) => {
          if (q.options[idx].name === q.target.name) {
            btn.classList.add('correct');
          }
        });
      }

      const expBox = document.getElementById('quiz-explanation-box');
      expBox.innerHTML = `<strong>Penjelasan (${esc(q.target.name)}):</strong><br>${esc(q.target.simpleDefinition || q.target.purpose)}<br>${q.target.analogy ? '<em>Analogi: ' + esc(q.target.analogy) + '</em>' : ''}`;
      expBox.style.display = 'block';

      document.getElementById('quiz-next-btn').style.display = 'block';
    }

    function nextQuestion() {
      currentQuizIdx++;
      if (currentQuizIdx < quizQuestions.length) {
        renderQuestion();
      } else {
        document.getElementById('quiz-question-text').textContent = `Kuis Selesai! Skor Akhir Anda: ${quizScore} / 100`;
        document.getElementById('quiz-options-list').innerHTML = '';
        document.getElementById('quiz-explanation-box').style.display = 'none';
        document.getElementById('quiz-next-btn').textContent = "Main Lagi";
        document.getElementById('quiz-next-btn').onclick = startQuiz;
      }
    }

    function filterDrawer(type) {
      toggleDrawer(false);
      const learnTab = document.querySelectorAll('.tab-item')[0];
      switchTab('learn', learnTab);

      let list = document.getElementById('learn-list');
      let items = [];
      if (type === 'all') {
        items = [...(DB.terms || []).map(t => ({...t, type: 'Istilah'})), ...(DB.languages || []).map(l => ({...l, type: 'Bahasa'}))];
      } else if (type === 'terms') {
        items = (DB.terms || []).map(t => ({...t, type: 'Istilah'}));
      } else if (type === 'langs') {
        items = (DB.languages || []).map(l => ({...l, type: 'Bahasa'}));
      }
      list.innerHTML = renderCardHTML(items);
    }

    function updateDrawerCounts() {
      document.getElementById('count-all').textContent = (DB.terms.length + DB.languages.length);
      document.getElementById('count-terms').textContent = DB.terms.length;
      document.getElementById('count-langs').textContent = DB.languages.length;
    }

    async function copyJSONToClipboard() {
      const jsonText = document.getElementById('json-input-text').value;
      if (!jsonText) {
        showToast("Kotak JSON kosong!");
        return;
      }
      try {
        await navigator.clipboard.writeText(jsonText);
        showToast("JSON berhasil disalin!");
      } catch (err) {
        showToast("Gagal menyalin JSON!");
      }
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('json-input-text').value = text;
          showToast("Berhasil menempelkan");
        }
      } catch (err) {
        showToast("Gagal menempelkan");
      }
    }

    function processJSONInput() {
      const jsonText = document.getElementById('json-input-text').value.trim();
      if (!jsonText) return;
      try {
        const uploaded = JSON.parse(jsonText);
        if (Array.isArray(uploaded)) {
          DB.terms = uploaded;
        } else {
          if (uploaded.terms) DB.terms = uploaded.terms;
          if (uploaded.languages) DB.languages = uploaded.languages;
        }
        localStorage.setItem('custom_json_data', JSON.stringify(DB));
        updateDrawerCounts();
        closeSheetModal();
        showToast("Database diperbarui");
      } catch (err) {
        showToast("Format JSON salah!");
      }
    }

    function resetData() {
      if (confirm("Reset data ke setelan awal bawaan?")) {
        localStorage.removeItem('custom_json_data');
        DB = JSON.parse(JSON.stringify(DEFAULT_DB));
        updateDrawerCounts();
        toggleDrawer(false);
        showToast("Database direset");
      }
    }

    /* MUAT ULANG DATA & TAMPILAN YANG SEDANG AKTIF */
    function refreshApp() {
      try {
        const saved = localStorage.getItem('custom_json_data');
        DB = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_DB));
      } catch (e) {
        DB = JSON.parse(JSON.stringify(DEFAULT_DB));
      }
      DB.terms = DB.terms || [];
      DB.languages = DB.languages || [];
      updateDrawerCounts();

      if (document.getElementById('learn-view').style.display === 'block') {
        renderLearnView();
      } else if (document.getElementById('quiz-view').style.display === 'block') {
        startQuiz();
      } else {
        onSearchInput(document.getElementById('main-search-input').value);
      }
    }

    /* TARIK KE BAWAH UNTUK REFRESH */
    (function () {
      const area = document.querySelector('.main-content');
      const ptr = document.getElementById('ptr');
      const ptrText = document.getElementById('ptr-text');
      const topBar = document.querySelector('.top-bar');
      const MAX_PULL = 90;
      const TRIGGER = 60;
      let startY = 0, dist = 0, pulling = false, busy = false;

      function setPull(px, animate) {
        area.style.transition = animate ? 'transform 0.25s ease' : 'none';
        area.style.transform = px ? 'translateY(' + px + 'px)' : '';
        ptr.style.transition = animate ? 'opacity 0.25s ease' : 'none';
        ptr.style.opacity = Math.min(px / TRIGGER, 1);
      }

      area.addEventListener('touchstart', (e) => {
        if (busy || area.scrollTop > 0 || e.touches.length !== 1) return;
        startY = e.touches[0].clientY;
        dist = 0;
        pulling = true;
        ptr.style.top = topBar.offsetHeight + 'px';
        ptrText.textContent = 'Tarik untuk memuat ulang';
      }, { passive: true });

      area.addEventListener('touchmove', (e) => {
        if (!pulling) return;
        const dy = e.touches[0].clientY - startY;
        if (dy <= 0 || area.scrollTop > 0) {
          dist = 0;
          setPull(0, false);
          return;
        }
        dist = Math.min(dy * 0.5, MAX_PULL);
        if (e.cancelable) e.preventDefault();
        ptrText.textContent = dist >= TRIGGER ? 'Lepas untuk memuat ulang' : 'Tarik untuk memuat ulang';
        setPull(dist, false);
      }, { passive: false });

      function endPull(allowRefresh) {
        if (!pulling) return;
        pulling = false;
        if (allowRefresh && dist >= TRIGGER) {
          busy = true;
          ptrText.textContent = 'Memuat ulang...';
          ptr.classList.add('loading');
          setPull(TRIGGER, true);
          setTimeout(() => {
            refreshApp();
            ptr.classList.remove('loading');
            setPull(0, true);
            busy = false;
          }, 600);
        } else {
          setPull(0, true);
        }
        dist = 0;
      }

      area.addEventListener('touchend', () => endPull(true));
      area.addEventListener('touchcancel', () => endPull(false));
    })();

    document.addEventListener('DOMContentLoaded', () => {
      updateDrawerCounts();
    });
  </script>
</body>
</html>
